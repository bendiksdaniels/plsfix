[package]
name = "plsfix-video"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false
description = "Builds the pls,fix motion-graphic video: capture real Office for the web screens, render the composition frame by frame, audit the file"

[lib]
name = "plsfix_video"
path = "src/lib.rs"

[[bin]]
name = "plsfix-video"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"

# the soundtrack is synthesised sample by sample; unoptimised it takes minutes instead of a second
[profile.dev]
opt-level = 2
