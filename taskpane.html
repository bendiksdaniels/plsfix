<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Model Tools</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <div class="eyebrow">MODEL TOOLS</div>
          <h1>Build cleaner models.</h1>
        </div>
        <span id="connection-status" class="connection waiting">Connecting</span>
      </header>

      <section class="selection-card" aria-labelledby="selection-heading">
        <div class="section-heading compact">
          <div>
            <p class="kicker">ACTIVE SELECTION</p>
            <h2 id="selection-heading">Selection inspector</h2>
          </div>
          <button id="refresh-selection" class="icon-button" type="button" aria-label="Refresh selection">↻</button>
        </div>
        <div class="selection-address" id="selection-address">Select a range in Excel</div>
        <div class="metrics" aria-live="polite">
          <div><strong id="metric-cells">—</strong><span>cells</span></div>
          <div><strong id="metric-formulas">—</strong><span>formulas</span></div>
          <div><strong id="metric-errors">—</strong><span>errors</span></div>
          <div><strong id="metric-blanks">—</strong><span>blank</span></div>
        </div>
      </section>

      <section aria-labelledby="format-heading">
        <div class="section-heading">
          <div>
            <p class="kicker">CONSISTENCY</p>
            <h2 id="format-heading">Model formatting</h2>
          </div>
        </div>
        <div class="tool-grid format-grid">
          <button class="tool style-title" data-action="style-title" type="button"><i></i><span>Title</span></button>
          <button class="tool style-header" data-action="style-header" type="button"><i></i><span>Header</span></button>
          <button class="tool style-input" data-action="style-input" type="button"><i></i><span>Input</span></button>
          <button class="tool style-formula" data-action="style-formula" type="button"><i></i><span>Formula</span></button>
          <button class="tool style-result" data-action="style-result" type="button"><i></i><span>Result</span></button>
          <button class="tool style-clear" data-action="clear-formats" type="button"><i></i><span>Clear</span></button>
        </div>
        <div class="number-strip" role="group" aria-label="Number formats">
          <button data-action="number-whole" type="button">1,234</button>
          <button data-action="number-decimal" type="button">1,234.0</button>
          <button data-action="number-currency" type="button">€ 1,234</button>
          <button data-action="number-percent" type="button">12.3%</button>
        </div>
      </section>

      <section aria-labelledby="tools-heading">
        <div class="section-heading">
          <div>
            <p class="kicker">SPEED</p>
            <h2 id="tools-heading">Model tools</h2>
          </div>
        </div>
        <div class="action-list">
          <button data-action="fill-right" type="button"><span class="action-icon">→</span><span><strong>Fill formula right</strong><small>Use the left cell as the source</small></span><kbd>R</kbd></button>
          <button data-action="fill-down" type="button"><span class="action-icon">↓</span><span><strong>Fill formula down</strong><small>Use the top cell as the source</small></span><kbd>D</kbd></button>
          <button data-action="if-error" type="button"><span class="action-icon">ƒ</span><span><strong>Wrap with IFERROR</strong><small>Return zero when a formula errors</small></span></button>
          <button data-action="autocolor" type="button"><span class="action-icon colors">●</span><span><strong>Autocolor selection</strong><small>Inputs blue, formulas black, links green</small></span></button>
        </div>
        <div class="scale-row">
          <button data-action="divide-1000" type="button">÷ 1,000</button>
          <button data-action="multiply-1000" type="button">× 1,000</button>
        </div>
      </section>

      <footer>
        <span class="privacy-dot"></span>
        Workbook data stays inside Excel
        <span>v0.1</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
