[package]
name = "plsfix-server"
version = "1.1.0"
edition = "2021"
description = "Static host for the Model Tools Excel add-in pane"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.5", features = ["fs"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
