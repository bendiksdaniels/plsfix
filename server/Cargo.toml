[package]
name = "plsfix-server"
version = "2.9.2"
edition = "2021"
description = "Static host and encrypted link relay for the pls,fix panes"
license = "MIT"
repository = "https://github.com/bendiksdaniels/plsfix"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["fs", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body = "1"
http-body-util = "0.1"
futures-util = "0.3"
