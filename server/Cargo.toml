[package]
name = "plsfix-server"
version = "2.3.2"
edition = "2021"
description = "Static host and encrypted link relay for the pls,fix panes"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
